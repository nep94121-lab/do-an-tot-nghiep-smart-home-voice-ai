; PlatformIO Configuration — Smart Home Voice AI (NodeMCU ESP8266 v2 Amica)
; Biên dịch: pio run -d firmware/esp8266_smarthome

[platformio]
src_dir = .

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
    -D SMARTHOME_SERVER_PORT=8088
    -D SMARTHOME_HARDWARE_API_KEY=\"\"
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.5
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
