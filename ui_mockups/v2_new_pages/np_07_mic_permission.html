<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quyền micro · Nhà thông minh</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap');:root{--page:#f5f7f7;--card:#fff;--ink:#172b31;--muted:#687a80;--line:#e5ebec;--accent:#087d85;--soft:#e6f3f2;--red:#c0392b;--redsoft:#fdecea;--orange:#d97706;--orangesoft:#fff7ed;--green:#15803d;--greensoft:#ecfdf5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:13px/1.5 'Be Vietnam Pro',sans-serif;color:var(--ink);background:var(--page)}button,input{font:inherit}button,a.btn{min-height:44px;padding:10px 16px;border-radius:10px;display:inline-flex;justify-content:center;align-items:center;gap:8px;font-weight:500;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #86c9cc;outline-offset:2px}.primary{background:var(--accent);border:1px solid var(--accent);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.tertiary{border:0;background:transparent;color:var(--accent)}.icon{width:20px;height:20px;flex:none}.stage{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(31,58,62,.045)}.error{width:min(560px,100%);padding:36px}.brand{color:var(--accent);font-weight:600;margin-bottom:24px}.mark{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:20px}.mark .icon{width:24px;height:24px}.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--accent);margin:0 0 8px}h1{font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}h2{font-size:16px;font-weight:600;margin:0 0 12px}p{margin:0 0 12px}.muted{color:var(--muted)}.note{background:#fafcfc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.label{display:block;font-weight:500;margin:16px 0 7px}.field{width:100%;height:44px;padding:0 12px;border:1px solid #cbd7d9;border-radius:10px;background:white}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 10px;display:inline-flex;align-items:center;gap:7px;font-weight:500}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}@media(max-width:600px){.error{padding:24px}.actions{display:grid}.actions>*{width:100%}h1{font-size:22px}}.dim-shell{margin:30px auto;max-width:900px;height:520px;padding:28px;filter:blur(2px)}.overlay{position:fixed;inset:0;background:#0f222680;display:grid;place-items:center;padding:16px}.dialog{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:28px}.dialog .actions{display:grid}.dialog .actions>*{width:100%}</style></head><body><div class="dim-shell card"><h2>Giọng nói</h2><p class="muted">Sẵn sàng nghe lệnh</p></div><main class="overlay"><section class="dialog card" role="dialog" aria-modal="true" aria-labelledby="mictitle"><div class="mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5a3 3 0 0 1 6 0v6 M5 10a7 7 0 0 0 9 6 M12 17v5 M8 22h8 M3 3l18 18"/></svg></div><h1 id="mictitle">Chưa thể dùng micro</h1><p class="muted">Bạn đã chặn quyền micro. Mở cài đặt trang trong trình duyệt, chọn Micro → Cho phép, rồi thử lại.</p><div class="note"><strong>Nếu đang dùng địa chỉ HTTP</strong><p style="margin:6px 0 0">Trình duyệt cần kết nối an toàn để dùng micro. Mở ứng dụng qua HTTPS.</p></div><div class="actions"><button class="primary" type="button">Thử lại</button><button class="secondary" type="button">Mở bản HTTPS</button><button class="tertiary" type="button">Đóng</button></div></section></main></body></html>
