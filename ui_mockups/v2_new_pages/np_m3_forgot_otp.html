<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quên mật khẩu · Nhà thông minh</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap');:root{--page:#f5f7f7;--card:#fff;--ink:#172b31;--muted:#687a80;--line:#e5ebec;--accent:#087d85;--soft:#e6f3f2;--red:#c0392b;--redsoft:#fdecea;--green:#15803d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.5 'Be Vietnam Pro',sans-serif;color:var(--ink);background:#e9eeee}button,input{font:inherit}button,a.btn{min-height:44px;padding:10px 14px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #86c9cc;outline-offset:2px}.primary{background:var(--accent);border:1px solid var(--accent);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.tertiary{background:transparent;border:0;color:var(--accent)}.icon{width:20px;height:20px;flex:none}.phone{width:min(390px,100%);height:844px;height:min(844px,100dvh);margin:20px auto;background:var(--page);box-shadow:0 18px 60px #26404327;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 16px 14px;min-height:70px}.toprow{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:22px;line-height:1.3;font-weight:600;margin:0}.top small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.main{overflow-y:auto;min-height:0;padding:16px 16px 28px}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(31,58,62,.045);padding:16px;margin-bottom:12px}.card h2,.section-title{font-size:16px;font-weight:600;margin:0 0 12px}.muted{color:var(--muted)}p{margin:0 0 10px}.pill{border:1px solid var(--line);border-radius:999px;display:inline-flex;align-items:center;gap:7px;padding:5px 9px;font-size:12px;font-weight:500}.dot{height:7px;width:7px;background:var(--green);border-radius:50%}.nav{background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px max(6px,env(safe-area-inset-bottom));min-height:68px}.nav a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:500;text-decoration:none}.nav a.active{color:var(--accent);background:var(--soft)}.nav .icon{width:20px;height:20px}.wide{width:100%}.placeholder{height:172px;border:1px dashed #b9ccce;border-radius:12px;background:#f4f9f9;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.sensorgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sensor{border:1px solid var(--line);border-radius:12px;padding:12px}.sensor strong{font-size:20px;font-weight:600;display:block;margin-top:4px}.divider{border:0;border-top:1px solid var(--line);margin:12px 0}.label{display:block;font-weight:500;margin:14px 0 6px}.field{width:100%;height:46px;padding:0 12px;border:1px solid #cbd7d9;border-radius:10px;background:#fff}.actions{display:grid;gap:10px;margin-top:16px}@media(max-width:430px){.phone{margin:0;width:100%;height:100vh;height:100dvh;box-shadow:none}}</style></head><body><div class="phone"><header class="top"><div class="toprow"><button class="tertiary" style="padding:0;min-width:44px" aria-label="Quay lại"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M12 19l-7-7 7-7"/></svg></button><span class="muted">Bước 2/3</span></div></header><main class="main"><h1 style="font-size:22px;font-weight:600;margin:8px 0 8px">Quên mật khẩu</h1><p class="muted">Nhập mã 6 số đã gửi tới Gmail của bạn.</p><section class="card" style="margin-top:22px"><p class="muted" style="font-size:12px">Đã gửi tới t***@gmail.com</p><label class="label" for="otp">Mã xác nhận</label><input class="field" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Nhập 6 chữ số"><p class="muted" style="font-size:12px;margin:8px 0 0">Mã có hiệu lực theo thời hạn hệ thống.</p><div class="actions"><button class="primary wide">Xác nhận mã</button><button class="secondary wide">Gửi lại mã</button><button class="tertiary wide">Đổi email</button></div></section><p class="muted" style="font-size:12px">Nếu mã sai hoặc hết hạn, thông báo xuất hiện ngay dưới ô nhập.</p></main><div style="height:16px;background:var(--page)"></div></div></body></html>
