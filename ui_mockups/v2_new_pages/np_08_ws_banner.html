<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kết nối lại · Nhà thông minh</title><style>@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap');:root{--page:#f5f7f7;--card:#fff;--ink:#172b31;--muted:#687a80;--line:#e5ebec;--accent:#087d85;--soft:#e6f3f2;--red:#c0392b;--redsoft:#fdecea;--orange:#d97706;--orangesoft:#fff7ed;--green:#15803d;--greensoft:#ecfdf5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:13px/1.5 'Be Vietnam Pro',sans-serif;color:var(--ink);background:var(--page)}button,input{font:inherit}button,a.btn{min-height:44px;padding:10px 16px;border-radius:10px;display:inline-flex;justify-content:center;align-items:center;gap:8px;font-weight:500;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #86c9cc;outline-offset:2px}.primary{background:var(--accent);border:1px solid var(--accent);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.tertiary{border:0;background:transparent;color:var(--accent)}.icon{width:20px;height:20px;flex:none}.stage{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px rgba(31,58,62,.045)}.error{width:min(560px,100%);padding:36px}.brand{color:var(--accent);font-weight:600;margin-bottom:24px}.mark{width:48px;height:48px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;margin-bottom:20px}.mark .icon{width:24px;height:24px}.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;color:var(--accent);margin:0 0 8px}h1{font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:0 0 12px}h2{font-size:16px;font-weight:600;margin:0 0 12px}p{margin:0 0 12px}.muted{color:var(--muted)}.note{background:#fafcfc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:20px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.label{display:block;font-weight:500;margin:16px 0 7px}.field{width:100%;height:44px;padding:0 12px;border:1px solid #cbd7d9;border-radius:10px;background:white}.pill{border:1px solid var(--line);border-radius:99px;padding:5px 10px;display:inline-flex;align-items:center;gap:7px;font-weight:500}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}@media(max-width:600px){.error{padding:24px}.actions{display:grid}.actions>*{width:100%}h1{font-size:22px}}.webhead{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 max(24px,calc((100vw - 1080px)/2))}.webmain{max-width:1080px;margin:auto;padding:28px 24px}.banner{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1px solid #f3d2a6;background:var(--orangesoft);color:#794607;border-radius:12px;padding:12px 14px;margin-bottom:28px}.bannertext{display:flex;gap:10px;align-items:flex-start}.banner button{flex:none}.restored{display:inline-flex;align-items:center;gap:8px;background:var(--greensoft);color:var(--green);padding:9px 12px;border-radius:8px;margin-top:18px}.restored small{color:var(--muted)}@media(max-width:600px){.webhead{padding:0 16px}.webmain{padding:16px}.banner{align-items:stretch;flex-direction:column}.banner button{width:100%}}</style></head><body><header class="webhead"><strong>Nhà thông minh</strong><span class="pill"><span class="dot" style="background:var(--orange)"></span>Mất kết nối</span></header><main class="webmain"><div class="banner" role="status" aria-live="polite"><div class="bannertext"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18 M2 9a15 15 0 0 1 17-2 M6 13a9 9 0 0 1 8-1 M10 17a3 3 0 0 1 3 0"/></svg><span><strong>Mất kết nối thời gian thực tới ngôi nhà.</strong><br>Đang kết nối lại (lần 1/5)…</span></div><button class="secondary" type="button">Kết nối ngay</button></div><h1>Tổng quan</h1><p class="muted">Theo dõi và điều khiển ngôi nhà</p><section class="card" style="padding:24px;min-height:180px"><h2>Ngôi nhà</h2><p class="muted">Trạng thái sẽ cập nhật khi kết nối trở lại.</p></section><p class="restored"><span class="dot"></span>Đã khôi phục kết nối <small>Ẩn sau 2 giây</small></p></main></body></html>
