name: Smart Home Voice AI — DevOps CI/CD 5-Gate Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-package:
    name: "5-Gate DevOps Verification & Packaging (Made-With-ML × SWE-agent × Archify)"
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run 5-Gate DevOps Pipeline (Hygiene + 5/5 Cross-Layer + Voice DSP E2E + Archify + SHA-256 ZIP)
        run: |
          python -X utf8 scripts/devops_pipeline.py --check --package

      - name: 5. Upload Verified Release Bundle & SHA-256 Receipt
        uses: actions/upload-artifact@v4
        with:
          name: smarthome-voice-ai-release-bundle
          path: |
            dist/smarthome-voice-ai-release.zip
            docs/kien_truc/DEVOPS_RELEASE_RECEIPT.json
            docs/kien_truc/smart-home-voice-ai.architecture.html
            docs/kien_truc/devops-cicd-pipeline.workflow.html
