<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mã QR hết hạn · Phiên Đăng ký Độc lập</title>
  <style>
    :root {
      --page: #f5f7f7;
      --card: #ffffff;
      --ink: #172b31;
      --muted: #687a80;
      --line: #e5ebec;
      --accent: #087d85;
      --soft: #e6f3f2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--ink);
      background: var(--page);
    }
    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(31, 58, 62, 0.045);
      width: min(560px, 100%);
      padding: 36px;
    }
    .brand {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 24px;
      font-size: 15px;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin: 0 0 8px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 26px;
      line-height: 1.3;
      font-weight: 600;
      margin: 0 0 12px;
      color: var(--ink);
    }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); }
    .note {
      background: #fafcfc;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="card">
      <div class="brand">Phiên Đăng ký QR Độc lập</div>
      <p class="eyebrow">LIÊN KẾT KHÔNG CÒN HIỆU LỰC</p>
      <h1>Mã QR đã hết hạn hoặc đã được sử dụng</h1>
      <p class="muted">Liên kết sau quét chỉ có hiệu lực một lần duy nhất trên đúng thiết bị đã quét mã.</p>
      <div class="note">Vui lòng nhờ Chủ nhà (Cấp 1) hiển thị mã QR mới và trực tiếp quét lại từ thiết bị của bạn.</div>
    </section>
  </main>
</body>
</html>
